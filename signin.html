<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Webchat</title>
  <link rel="icon" href="data:,">

  <script src="assets/js/local.js"></script>

  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/forms.css">

  <!-- Même ordre de chargement que index.html (pas de data.js : cette page n'en a pas besoin) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="assets/js/spclient.js" defer></script>

  <script src="assets/js/auth.js" defer></script>
  <script src="assets/js/signin.js" defer></script>
</head>
<body>
  <header class="page-header">
    <strong class="page-header-title">Webchat</strong>
  </header>
  <main class="signin">
    <h1>Connexion</h1>
    <form id="form-signin">
      <!-- label/for + id : cliquer sur le texte active le champ, et les lecteurs d'écran l'annoncent -->
      <label for="email">Adresse courriel</label>
      <input id="email" type="email" autocomplete="email">

      <label for="password">Mot de passe</label>
      <input id="password" type="password" autocomplete="current-password">

      <button type="submit">Se connecter</button>
    </form>
    <button id="button-signup" type="button">S'inscrire</button>
  </main>
  <footer class="page-footer">
    <p>Webchat</p>
  </footer>
</body>
</html>
