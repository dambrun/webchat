<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paramètres - Webchat</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/forms.css">
</head>
<body>
  <header class="page-header">
    <strong class="page-header-title">Webchat</strong>
    <a href="index.html">Retour</a>
  </header>
  <main class="settings">
    <h1>Paramètres</h1>
    <h2>Nom de la personne utilisatrice</h2>
    <fieldset>
      <legend>Thème</legend>
      <label><input type="radio" name="theme" value="auto" checked>Automatique</label>
      <label><input type="radio" name="theme" value="light">Clair</label>
      <label><input type="radio" name="theme" value="dark">Sombre</label>
    </fieldset>
    <button type="button">Se déconnecter</button>
  </main>
  <footer class="page-footer">
    <p>Webchat</p>
  </footer>
</body>
</html>
