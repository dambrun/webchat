<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webchat</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header>
    <h1>Webchat</h1>
    <a href="settings.html"><img src="" alt="icône des paramètres"></a>
  </header>
  <div>
    <form>
      <input type="text" placeholder="Nouveau salon">
      <button>+</button>
    </form>
    <nav>
      <ul>
        <li><button>Nom d'un salon</button></li>
        <li><button>Nom d'un autre salon</button></li>
        <li><button>Nom d'encore un autre salon</button></li>
      </ul>
    </nav>
  </div>
  
  <main>
    <header>
      <h2>
        Nom du salon en cours
      </h2>
    </header>
    <p>
      Aucun salon sélectionné
    </p>
    <section>
      <article>
        <h3>Nom d'une personne utilisatrice</h3>
        <p>Contenu d'un message</p>
        <time>2000/01/01 00:00:00</time>
      </article>
      <article>
        <h3>Nom d'une autre personne utilisatrice</h3>
        <p>Contenu d'un autre message</p>
        <time>2000/01/01 00:00:01</time>
      </article>
    </section>
    <footer>
      <form>
        <input type="text" placeholder="Nouveau message">
        <button>Envoyer</button>
      </form>
    </footer>
  </main>
</body>
</html>
